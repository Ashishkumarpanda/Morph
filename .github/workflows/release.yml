name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 0.1.0)
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Set release version
        run: mvn -B org.codehaus.mojo:versions-maven-plugin:2.17.1:set "-DnewVersion=${{ inputs.version }}" "-DgenerateBackupPoms=false"

      - name: Build and verify release artifacts
        run: mvn -B -Prelease clean verify

      - name: Deploy to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$MAVEN_USERNAME" ]; then
            echo "Skipping Maven Central deploy: CENTRAL_TOKEN_USERNAME secret is not configured."
            exit 0
          fi
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${MAVEN_USERNAME}</username>
                <password>${MAVEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
          echo "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          mvn -B -Prelease deploy -DskipTests -Dgpg.passphrase=${MAVEN_GPG_PASSPHRASE}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts-${{ inputs.version }}
          path: |
            **/target/*.jar
            !**/target/original-*
